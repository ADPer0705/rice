# Hypridle — locking hooks

general {
    lock_cmd = pidof hyprlock >/dev/null || hyprlock   # avoid starting several lockers
    before_sleep_cmd = loginctl lock-session           # lock before every suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock after 10 minutes idle (raise the timeout or delete this block to disable)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
