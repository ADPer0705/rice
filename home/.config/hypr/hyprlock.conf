# Hyprlock — lockscreen used by SUPER+ALT+L and before suspend

$font = JetBrainsMono Nerd Font
$accent = rgba(00f0ffee)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

# Clock
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 96
    color = rgba(ffffffee)
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 18
    color = rgba(ffffffaa)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 10
    inner_color = rgba(0d253899)
    outer_color = $accent
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff3366ee)
    font_color = rgba(ffffffee)
    font_family = $font
    placeholder_text = <span foreground="##ffffff88">Password...</span>
    fail_text = <span foreground="##ff3366">Wrong password</span>
    fade_on_empty = false
    dots_spacing = 0.3
}
